services:
  postgres:
    image: postgres:16-alpine
    container_name: votar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: votar_blockchain
      POSTGRES_USER: votar
      POSTGRES_PASSWORD: votar_local_pw
    ports:
      - "5432:5432"
    volumes:
      - votar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votar -d votar_blockchain"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  votar_pgdata:
